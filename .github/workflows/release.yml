name: Release

on:
  # Manual: Actions tab -> Release -> Run workflow. Leave the version blank and
  # the next one is worked out for you; fill it in only to force a value.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (blank = next CalVer; or e.g. 2026.9.3 / 2026.9.3-rc1)'
        required: false
        type: string
  # Or push a tag: git tag v2026.9.3 && git push origin v2026.9.3
  push:
    tags:
      - 'v*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag on a manual dispatch
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # Full history with tags: resolving the next CalVer means knowing which
      # releases this month already exist.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Versions are CalVer, YYYY.M.N — see docs/deploying.md for why. N counts
      # releases within that month, not the day of the month, so two releases
      # on one day need no special case.
      - id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            V="$REQUESTED"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            Y="$(date -u +%Y)"
            M="$(date -u +%-m)"   # no leading zero: 2026.09.1 is not valid semver
            LAST="$(git tag -l "v$Y.$M.*" | sed "s|^v$Y\.$M\.||" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
            V="$Y.$M.$(( ${LAST:-0} + 1 ))"
            echo "no version given — next release this month is $V"
          fi

          # The shape guard. Leading zeros are rejected on purpose: electron-builder
          # and electron-updater parse this as semver, and "2026.09.1" is not valid
          # semver, so it would fail at packaging time instead of here.
          #
          # An optional -rcN suffix rides along for a rehearsal release. It is
          # still valid semver, and semver orders a prerelease *below* its
          # release, so 2026.9.1-rc1 < 2026.9.1 — an rc and the real thing share
          # an N on purpose. The auto-increment above ignores rc tags for the
          # same reason: cutting rc1 must not burn the number its release wants.
          echo "$V" | grep -Eq '^[0-9]{4}\.(1[0-2]|[1-9])\.[1-9][0-9]*(-rc[1-9][0-9]*)?$' || {
            echo "::error::version '$V' is not CalVer YYYY.M.N or YYYY.M.N-rcN (no leading zeros)"; exit 1;
          }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      # A manual dispatch has no tag yet — create one at this commit so the
      # release and PartyKit deploy hang off a real ref. A tag-push run skips this.
      - if: ${{ github.ref_type != 'tag' }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists"; exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The renderer bundles workspace packages from source, so the whole
      # repo must type-check and test before we cut a build.
      - run: npm run typecheck
      - run: npm test

      # Stamp the release version into the app manifest for this build only —
      # drives the installer filename and app.getVersion(). Not committed: with
      # CalVer resolved at release time there is nothing to bump by hand, so the
      # repo's package.json stays at its placeholder 0.0.0 for good.
      - name: Set app version to ${{ needs.prepare.outputs.version }}
        run: npm version --no-git-tag-version "${{ needs.prepare.outputs.version }}"
        working-directory: apps/desktop

      # Export signing vars only when a cert secret is actually present. Passing
      # an empty CSC_LINK makes electron-builder try to resolve a bogus cert
      # source and fail ("not a file"); with no cert we turn signing off outright
      # so it doesn't scan an empty keychain either. The afterPack fuse hook
      # keys off the same signal (asar-integrity fuses need a real signature).
      - name: Configure code signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_PW: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            {
              echo "CSC_LINK=$MAC_CSC_LINK"
              echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
              echo "APPLE_ID=$APPLE_ID_SECRET"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_PW"
              echo "APPLE_TEAM_ID=$APPLE_TEAM"
            } >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          if [ -n "$WIN_CSC_LINK_SECRET" ]; then
            {
              echo "WIN_CSC_LINK=$WIN_CSC_LINK_SECRET"
              echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_PW"
            } >> "$GITHUB_ENV"
          fi

      - name: Package the desktop app
        working-directory: apps/desktop
        run: npm run package
        # The online host is baked from apps/desktop/.env.production. To point a
        # build at a different room, edit that file (an empty env var here would
        # shadow it with a blank value — see src/online/hostUrl.ts).

      # itch.io, from the build job rather than a later one: the artifacts
      # below travel as a zip that does not preserve the executable bit, and a
      # macOS .app or an AppImage that has lost it will not launch. Pushing
      # from the runner that produced the build keeps the permissions butler
      # then uploads.
      #
      # The push is skipped without a BUTLER_API_KEY, the same way signing is —
      # and via an env var written here, because a step's own `env:` block is
      # not readable from its own `if:`.
      # ITCH_TARGET has no default on purpose. A publish step that guesses an
      # account name is one that can aim at the wrong project, and the guess
      # stays invisible until it fails — or until it doesn't. Set the repo
      # variable, or the push simply does not happen.
      - name: Configure itch.io publishing
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          # Read from both places it could plausibly live. `vars` only sees the
          # Variables tab, so a target set as a *secret* resolves to empty and
          # the push silently skips — which is exactly what happened on the
          # first attempt. Taking either costs nothing and removes a failure
          # whose only symptom is a skipped step.
          ITCH_TARGET: ${{ vars.ITCH_TARGET || secrets.ITCH_TARGET }}
        run: |
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "no BUTLER_API_KEY secret — skipping the itch.io push"
          elif [ -z "${ITCH_TARGET:-}" ]; then
            echo "::warning::BUTLER_API_KEY is set but ITCH_TARGET is not — skipping the itch.io push"
            echo "Set ITCH_TARGET (repo variable or secret) to your itch user and project, e.g. yourname/boomtown."
            echo "Note: a value saved under Settings > Environments is not visible here unless the job declares that environment."
          else
            echo "ITCH_PUBLISH=true" >> "$GITHUB_ENV"
          fi

      # Pinned by commit SHA (v3.0.2, 2026-08-06) rather than the moving @v3
      # tag: this action supplies the binary that is about to be handed our
      # itch API key, so the version that runs should be one we chose. Bump it
      # deliberately. It is deliberately not given BUTLER_API_KEY — it does not
      # need one to install a CLI.
      #
      # Known sharp edge: the action maps an arm64 macOS runner straight to
      # butler's `darwin-arm64` channel with no fallback, so if that channel
      # ever goes missing the mac leg fails outright rather than degrading to
      # the amd64 build. There is no arch input to override it.
      - name: Set up butler
        if: env.ITCH_PUBLISH == 'true'
        uses: remarkablegames/setup-butler@f9feeb5d4334294e96686b81150fca5ebbff8255

      - name: Publish to itch.io
        if: env.ITCH_PUBLISH == 'true'
        shell: bash
        working-directory: apps/desktop
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET || secrets.ITCH_TARGET }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-latest)   PLATFORM=mac ;;
            windows-latest) PLATFORM=win ;;
            *)              PLATFORM=linux ;;
          esac
          # Stages the .itch.toml manifest and prints what to push: the unpacked
          # build directory on macOS and Windows, the AppImage on Linux.
          PUSH_PATH="$(node electron/itch.mjs "$PLATFORM")"
          CHANNEL="$(node -e "import('./electron/itch.mjs').then((m) => process.stdout.write(m.CHANNELS['$PLATFORM']))")"
          # itch recommends wiring this into CI, and it is the only check that
          # runs against a real packaged build: it exits non-zero on a launch
          # target that does not exist, a misspelled manifest key, or a missing
          # prerequisite — none of which the unit tests can see.
          butler validate "$PUSH_PATH"

          echo "pushing $PUSH_PATH to $ITCH_TARGET:$CHANNEL as $VERSION"
          butler push "$PUSH_PATH" "$ITCH_TARGET:$CHANNEL" --userversion "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # No `*.blockmap`: those exist so an auto‑updater can download only
          # the changed chunks of an installer, and this app has no update feed
          # yet (see the `publish:` note in electron-builder.yml). Until it does,
          # they are two more files on the release page that nobody can use.
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
          if-no-files-found: warn

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Boomtown ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: installers/*

  deploy-party:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The couch-mode phone page (#62) is served by the room's own deploy, from
      # packages/server/public/phone, so it is built from this same commit.
      - name: Build the phone page
        run: npm run phone:build
      - name: Deploy the PartyKit room
        working-directory: packages/server
        run: npx partykit deploy
        env:
          # PartyKit's CLI authenticates through GitHub — the headless path
          # needs BOTH the token and the login (username) or it falls back to
          # the interactive browser login and hangs in CI.
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
