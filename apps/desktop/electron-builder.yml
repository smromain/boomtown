# electron-builder targets for the three desktop OSes (U19, KTD14).
# Signing credentials come from the release workflow's secrets; a local
# `electron-builder` run produces unsigned artifacts.
appId: com.boomtown.desktop
productName: Boomtown
copyright: © 2026 Boomtown

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

# The renderer bundles workspace packages from source at build time, so only
# runtime deps that Electron itself loads need to ship.
asarUnpack:
  - out/main/**

mac:
  category: public.app-category.board-games
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  # Electron fuses (KTD9) stay on in the packaged build.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Game

# Auto-update feed. `updater.ts` reads the generic provider on launch.
publish:
  provider: generic
  url: https://updates.boomtown.example/desktop
