# electron-builder targets for the three desktop OSes (U19, KTD14).
# Signing credentials come from the release workflow's secrets; a local
# `electron-builder` run produces unsigned artifacts.
appId: com.boomtown.desktop
productName: Boomtown
# The launched binary's name on Windows and Linux. Without it electron-builder
# derives one from the *package* name, which is `@boomtown/desktop` — and it
# sanitises that to `@boomtowndesktop`, a name with an `@` in it that no player
# should ever see and that the itch manifests cannot point at. Setting it makes
# the path predictable, which is what `electron/afterPack.mjs` and
# `build/itch/*.itch.toml` both assume.
executableName: boomtown
copyright: © 2026 Boomtown

directories:
  output: dist
  buildResources: build

# One 1024x1024 source, converted to .icns / .ico at package time. Generated
# from the logo by `python3 design/make_icon.py` — see that script for why the
# icon is the skyline mark rather than the full wordmark.
icon: build/icon.png

# The same file inside the installed app, for `BrowserWindow`'s window icon
# (Windows and Linux draw it in the taskbar; macOS uses the bundle icon).
extraResources:
  - from: build/icon.png
    to: icon.png

# Flip the Electron security fuses (KTD9) on the packed binary before signing.
afterPack: electron/afterPack.mjs

# electron-vite bundles the renderer and the main/preload processes from source
# (workspace packages via the vite aliases, npm deps inlined), so the packaged
# app is self-contained — only the build output and a minimal manifest ship.
files:
  - out/**/*
  - package.json

asarUnpack:
  - out/main/**

mac:
  category: public.app-category.board-games
  # One universal (arm64 + x64) DMG rather than two per-arch ones. Two artifacts
  # meant one of them was always wrong for a given Mac, and the wrong one did not
  # fail loudly — an x64 bundle runs on Apple Silicon under Rosetta 2 and is
  # merely very slow. A universal bundle is larger and always native.
  #
  # This changes how `afterPack` runs: electron-builder packs x64 and arm64
  # separately, calls the hook on each, merges them with `@electron/universal`,
  # then calls the hook again on the merged app. See `electron/afterPack.mjs` —
  # the ad-hoc re-sign must happen only on that last call.
  #
  # itch.io does not get the DMG: `electron/itch.mjs` pushes the `.app` from
  # `dist/mac-universal/` with butler, which is itch's own advice — push the
  # `.app`, with the manifest beside it in a folder. It goes up under a folder
  # named for the release, so an itch update never rewrites a signed binary in
  # place (see `macReleaseDir` there). butler manages
  # symlinks and fixes permissions on that push and the itch app fixes them
  # again at launch, so no separate zip target is needed for it.
  target:
    - target: dmg
      arch:
        - universal
  hardenedRuntime: true
  gatekeeperAssess: false
  # Electron fuses (KTD9) are flipped by the afterPack hook above.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  # NSIS is the download on the GitHub release page. It is deliberately *not*
  # what goes to itch.io: itch's compatibility policy ranks traditional
  # installers (NSIS, MSI, InnoSetup) second-worst — "may require administrator
  # access and offer the poorest user experience" — and its Windows page says to
  # push the install folder instead. `electron/itch.mjs` pushes the
  # `dist/win-unpacked/` directory electron-builder packs before building this.
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  # AppImage for the GitHub release page. itch.io gets `dist/linux-unpacked/`
  # instead (`electron/itch.mjs`): itch's Linux guidance is to make a portable
  # build and push it with butler, and a folder is something butler can patch
  # and the itch app can fix permissions on — where an AppImage is one opaque
  # file that also needs FUSE on the player's machine.
  target:
    - target: AppImage
      arch:
        - x64
  category: Game

# Auto-update is wired in code (electron/updater.ts) but has no feed yet — that
# needs a hosting decision (GitHub Releases, S3, a static host). Until then a
# packaged build ships without an update channel and `checkForUpdates()` is a
# graceful no-op. To enable: add a `publish:` block here (e.g.
#   publish:
#     provider: github
#     owner: <org>
#     repo: <repo>
# ), and electron-builder will emit the `latest-*.yml` manifests on `npm run
# package` / the release workflow.
